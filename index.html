<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Racing 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }

    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; transition: opacity 0.5s;
    }
    #loading-screen h1 {
      font-size: 4em; color: #e94560; text-shadow: 0 0 20px rgba(233,69,96,0.5);
      margin-bottom: 20px; letter-spacing: 5px;
    }
    #loading-screen .subtitle { color: #a8a8a8; font-size: 1.2em; margin-bottom: 40px; }
    .loader {
      width: 200px; height: 4px; background: #333; border-radius: 2px; overflow: hidden;
    }
    .loader-bar {
      width: 0%; height: 100%; background: #e94560; border-radius: 2px;
      transition: width 0.3s;
    }

    #start-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 900;
    }
    #start-screen h1 {
      font-size: 5em; color: #e94560; text-shadow: 0 0 30px rgba(233,69,96,0.6);
      margin-bottom: 10px; letter-spacing: 8px;
    }
    #start-screen .tagline { color: #ccc; font-size: 1.3em; margin-bottom: 50px; }
    .btn {
      padding: 15px 60px; font-size: 1.4em; border: 2px solid #e94560;
      background: transparent; color: #e94560; cursor: pointer; letter-spacing: 3px;
      transition: all 0.3s; text-transform: uppercase; margin: 10px;
    }
    .btn:hover { background: #e94560; color: #fff; }
    .controls-info {
      margin-top: 40px; color: #888; font-size: 0.9em; text-align: center; line-height: 1.8;
    }

    #hud {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 100; display: none;
    }
    #speed-display {
      position: absolute; bottom: 30px; right: 30px;
      background: rgba(0,0,0,0.7); border: 1px solid #e94560; border-radius: 10px;
      padding: 15px 25px; text-align: center;
    }
    #speed-value { font-size: 3em; color: #fff; font-weight: bold; }
    #speed-unit { color: #e94560; font-size: 0.9em; }
    #lap-display {
      position: absolute; top: 20px; right: 30px;
      background: rgba(0,0,0,0.7); border: 1px solid #e94560; border-radius: 10px;
      padding: 12px 20px; color: #fff; font-size: 1.2em;
    }
    #timer-display {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); border: 1px solid #e94560; border-radius: 10px;
      padding: 12px 20px; color: #fff; font-size: 1.5em; font-weight: bold;
    }
    #position-display {
      position: absolute; top: 20px; left: 30px;
      background: rgba(0,0,0,0.7); border: 1px solid #e94560; border-radius: 10px;
      padding: 12px 20px; color: #fff; font-size: 1.5em;
    }
    #minimap {
      position: absolute; bottom: 30px; left: 30px;
      width: 180px; height: 180px;
      background: rgba(0,0,0,0.6); border: 1px solid #444; border-radius: 10px;
    }
    #countdown {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 8em; color: #e94560; text-shadow: 0 0 40px rgba(233,69,96,0.8);
      z-index: 200; display: none; font-weight: bold;
    }
    #race-result {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 300;
    }
    #race-result h1 { font-size: 4em; color: #e94560; margin-bottom: 20px; }
    #race-result .stats { color: #ccc; font-size: 1.3em; line-height: 2; margin-bottom: 30px; }
    #gear-display {
      position: absolute; bottom: 100px; right: 40px;
      color: #e94560; font-size: 2em; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1>F1 RACING</h1>
    <div class="subtitle">Loading game assets...</div>
    <div class="loader"><div class="loader-bar" id="loader-bar"></div></div>
  </div>

  <div id="start-screen">
    <h1>F1 RACING</h1>
    <div class="tagline">3D Formula 1 Experience</div>
    <button class="btn" id="btn-race">Start Race</button>
    <div class="controls-info">
      <strong>Controls:</strong><br>
      W / ↑ — Accelerate &nbsp; | &nbsp; S / ↓ — Brake<br>
      A / ↑ — Steer Left &nbsp; | &nbsp; D / → — Steer Right<br>
      Space — Handbrake &nbsp; | &nbsp; C — Change Camera
    </div>
  </div>

  <div id="hud">
    <div id="position-display">1st</div>
    <div id="timer-display">00:00.000</div>
    <div id="lap-display">Lap 1/3</div>
    <div id="speed-display">
      <div id="speed-value">0</div>
      <div id="speed-unit">KM/H</div>
    </div>
    <div id="gear-display">N</div>
    <canvas id="minimap"></canvas>
  </div>

  <div id="countdown"></div>

  <div id="race-result">
    <h1>RACE COMPLETE</h1>
    <div class="stats" id="result-stats"></div>
    <button class="btn" id="btn-restart">Race Again</button>
    <button class="btn" id="btn-menu">Main Menu</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
